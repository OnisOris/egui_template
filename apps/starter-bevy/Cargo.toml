[package]
name = "starter-bevy"
version.workspace = true
edition.workspace = true

[dependencies]
bevy.workspace = true
bevy_egui.workspace = true
walkers = "=0.62.0"
directories = "=6.0.0"
serde_json.workspace = true
gltf = { version = "=1.4.1", default-features = false }
serde.workspace = true
rfd.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "webp", "png"] }
blake3 = { version = "=1.8.7", default-features = false }
starter-core = { path = "../../crates/starter-core" }
starter-ui = { path = "../../crates/starter-ui" }

reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }

bincode = { version = "=2.0.1", features = ["serde"] }
geo = "=0.31.0"
earcutr = "=0.5.0"
mvt-reader = "=2.5.0"

[dev-dependencies]
tempfile = "=3.27.0"
egui_kittest.workspace = true
