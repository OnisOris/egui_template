[workspace]
members = ["apps/starter-desktop", "crates/starter-core", "crates/starter-ui"]
default-members = ["apps/starter-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
egui = { version = "=0.37.0", features = ["default_fonts"] }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_tiles = "=0.18.0"
egui_ltreeview = "=0.10.0"
egui_table = "=0.11.0"
egui_plot = "=0.38.0"
egui_kittest = "=0.37.0"
rfd = "=0.18.0"
pollster = "=1.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
