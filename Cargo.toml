[workspace]
members = [
    "apps/starter-bevy",
    "apps/starter-desktop",
    "crates/starter-core",
    "crates/starter-ui",
]
default-members = ["apps/starter-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
egui = { version = "=0.36.2", features = ["default_fonts"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_tiles = "=0.17.1"
egui_ltreeview = "=0.9.0"
egui_table = "=0.10.0"
egui_plot = "=0.37.0"
egui_kittest = "=0.36.2"
rfd = "=0.18.0"
pollster = "=1.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
bevy = { version = "=0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_gltf",
    "mesh_picking",
    "png",
    "jpeg",
    "bevy_log",
    "reflect_auto_register",
    "bevy_winit",
    "x11",
    "wayland",
    "default_font",
    "multi_threaded",
    "bevy_window",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "tonemapping_luts",
] }
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "default_fonts"] }
